<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c2044">
<title>電源路徑導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c2044;
    --bg-soft: #22264f;
    --surface: #2a2f66;
    --surface-hover: #363c82;
    --line: #424896;
    --text: #f2f1ff;
    --text-dim: #a7abdc;
    --yellow: #ffd23f;
    --green: #06d6a0;
    --purple: #BE77FF;
    --coral: #ef476f;
    --cyan: #4cc9f0;
    --radius: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(76,201,240,0.10), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(239,71,111,0.10), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 32px 20px 80px;
  }

  .wrap{ max-width: 920px; margin: 0 auto; }

  header{ margin-bottom: 24px; }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px; letter-spacing:.08em; color: var(--yellow);
    margin-bottom:10px; text-transform: uppercase;
  }
  .eyebrow .dot{
    width:8px; height:8px; border-radius:50%; background: var(--yellow);
    box-shadow: 0 0 10px var(--yellow);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .subtitle{ color: var(--text-dim); font-size:15px; margin:0; }

  .tabs{
    display:flex; align-items:center; margin: 24px 0 18px;
    border-bottom: 1px solid var(--line);
    justify-content: space-between;
  }
  .tab-group{
    display:flex; gap:8px;
  }
  .update-time{
    font-size:16px; color: var(--text-dim); white-space:nowrap;
    font-family:'JetBrains Mono', monospace;
  }
  .tab-btn{
    background:none; border:none; cursor:pointer;
    color: var(--text-dim); font-family:'Inter',sans-serif;
    font-size:16px; font-weight:600;
    padding: 10px 4px; margin-bottom:-1px;
    border-bottom: 2px solid transparent;
    display:flex; align-items:center; gap:6px;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{ color: var(--yellow); border-color: var(--yellow); }

  .search-box{
    position:relative; margin: 0;
  }
  .search-box input{
    width:100%; background: var(--bg-soft); border:1px solid var(--line);
    border-radius: 999px; padding: 12px 18px 12px 42px;
    color: var(--text); font-family:'Inter',sans-serif; font-size:16px;
    outline:none; transition: border-color .15s;
  }
  .search-box input:focus{ border-color: var(--cyan); }
  .search-box .icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color: var(--text-dim); pointer-events:none;
  }
  .search-results{
    display:flex; flex-direction:column; gap:6px;
  }
  .search-results:not(:empty){ margin-top:10px; }
  .search-result{
    text-align:left; background: var(--bg-soft); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; cursor:pointer; color: var(--text);
    display:flex; flex-direction:column; gap:2px;
    transition: background .15s, border-color .15s;
  }
  .search-result:hover{ background: var(--surface-hover); border-color: var(--cyan); }
  .search-result .r-name{ font-size:14px; font-weight:600; }
  .search-result .r-path{ font-size:12px; color: var(--text-dim); font-family:'JetBrains Mono', monospace; }
  .search-empty{ color: var(--text-dim); font-size:13px; padding: 6px 4px; }

  .breadcrumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:0;
    margin: 0 0 16px;
    padding: 14px 16px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .crumb-btn{
    background:none; border:none; color: var(--text-dim);
    font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:500;
    cursor:pointer; padding:6px 10px; border-radius:999px;
    display:flex; align-items:center; gap:6px;
    transition: color .15s, background .15s;
    white-space: nowrap;
  }
  .crumb-btn:hover{ color: var(--text); background: rgba(255,255,255,0.06); }
  .crumb-btn.current{ color: var(--yellow); font-weight:700; }
  .crumb-wire{
     color: var(--text-dim); font-size:13px; margin: 0 2px; 
  }

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--bg-soft); border:1px solid var(--line);
    color: var(--text); font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding: 9px 16px; border-radius:999px; cursor:pointer;
    margin: 16px 0 0;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .back-btn:hover{ background: var(--surface-hover); border-color: var(--cyan); transform: translateX(-2px); }
  .back-btn:disabled{ opacity:.35; cursor:default; transform:none; }

  main#content{ margin-top: 16px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }

  .breaker{
    position:relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px 16px;
    text-align:left;
    cursor:pointer;
    color: var(--text);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:10px;
    min-height: 108px;
  }
  .breaker:hover{
    background: var(--surface-hover);
    transform: translateY(-3px);
    border-color: var(--cyan);
    box-shadow: 0 10px 24px rgba(76,201,240,0.18);
  }
  .breaker:active{ transform: translateY(-1px) scale(.98); }

  .breaker .top-row{
    display:flex; align-items:center; gap:8px; flex-wrap: wrap;
  }
  .breaker .led{
    width:10px; height:10px; border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    flex-shrink:0;
  }
  .breaker[data-depth="0"] .led{ background: var(--yellow); box-shadow:0 0 8px var(--yellow); }
  .breaker[data-depth="1"] .led{ background: var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .breaker[data-depth="2"] .led{ background: var(--purple); box-shadow:0 0 8px var(--purple); }
  .breaker[data-depth="3"] .led{ background: var(--yellow); box-shadow:0 0 8px var(--yellow); }
  .breaker[data-depth="4"] .led{ background: var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .breaker[data-depth="5"] .led{ background: var(--purple); box-shadow:0 0 8px var(--purple); }
  .breaker[data-depth="6"] .led{ background: var(--yellow); box-shadow:0 0 8px var(--yellow); }
  .breaker[data-depth="7"] .led{ background: var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .breaker[data-depth="8"] .led{ background: var(--purple); box-shadow:0 0 8px var(--purple); }

  .breaker .code{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:15px;color: var(--text-dim);
    word-break: break-all;
  }
  .breaker .device-name{
    font-size: 20px; font-weight:600; color: var(--text); line-height:1.35;
  }
  .breaker .meta{
    font-size: 15px; color: var(--text-dim); line-height:1.4;
    margin-top: auto; padding-top: 6px;
  }
  .breaker .arrow{
    color: var(--text-dim); font-size:16px; opacity:.6; flex-shrink:0;
  }
  .breaker .count-badge{
    position:absolute; top:14px; right:14px;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    color: var(--bg); background: var(--cyan);
    padding: 2px 7px; border-radius: 999px; font-weight:700;
  }

  .breaker .state-badge{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700;
    padding: 3px 8px; border-radius:999px; letter-spacing:.05em; flex-shrink:0;
  }
  .breaker .state-badge.on{ background: rgba(6,214,160,0.15); color: var(--green); border:1px solid var(--green); }
  .breaker .state-badge.off{ background: rgba(255,183,140,0.15); color: #ffb78c; border:1px solid #ffb78c; }
  .breaker.flagged{ border-color: var(--coral); }
  .breaker.flagged .led{ background: var(--coral); box-shadow:0 0 8px var(--coral); }

  .detail-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px;
    position:relative;
    overflow:hidden;
  }
  .detail-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, var(--yellow), var(--green), var(--cyan), var(--coral));
  }
  .detail-card .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:12px;
    color: var(--yellow); background: rgba(255,210,63,0.1);
    padding: 4px 10px; border-radius:999px; margin-bottom:14px;
  }
  .detail-card h2{
    font-family:'Space Grotesk', sans-serif; font-size: 26px; margin: 0 0 16px;
  }
  .detail-card .note-row{
    display:flex; align-items:center; gap:10px;
    color: var(--text-dim); font-size:15px; line-height:1.6;
    margin-bottom: 8px;
  }
  .detail-card .note-row svg{ flex-shrink:0; color: var(--cyan); }

  .empty{
    color: var(--text-dim); font-size:14px; padding: 20px 4px;
  }

  footer{
    max-width:920px; margin: 40px auto 0; text-align:center;
    color: var(--text-dim); font-size:12px;
  }

  /* ---------- 手機版優化 ---------- */
  @media (max-width: 600px){
    body{ padding: 20px 14px 60px; }

    .eyebrow{ font-size:11px; }
    .subtitle{ font-size:14px; }

    .tabs{ gap:4px; }
    .tab-btn{ font-size:13px; padding: 9px 6px; }

    .breadcrumb{ padding: 12px 12px; border-radius:18px; }
    .crumb-btn{ font-size:12px; padding:6px 8px; }

    .back-btn{
      width:100%; justify-content:center;
      padding: 13px 16px; font-size:14px;
    }

    .grid{
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap:10px;
    }
    .breaker{
      padding: 16px 14px 14px;
      min-height: 96px;
    }
    .breaker .code{ font-size:14px; }
    .breaker .device-name{ font-size:16px; }
    .breaker .meta{ font-size:14px; }

    .detail-card{ padding: 24px 20px; }
    .detail-card h2{ font-size:22px; }
  }

</head>
<body>
<div class="wrap">

  </header>

  <!-- 4. 按鈕（電箱1、1-1...等） -->
  <main id="content"></main>
</div>

/* ====================== 以下為程式邏輯 ====================== */

let activeTab = "tree";
let path = [];
let devicePath = [];
let sourcePath = [];

function isLeaf(node) {
  return !node.children || node.children.length === 0;
}

function flattenTree(nodes, ancestors) {
  ancestors = ancestors || [];
  let result = [];
  (nodes || []).forEach((node) => {
    const fullPath = ancestors.concat([node]);
    result.push({ node, path: fullPath });
    if (node.children && node.children.length > 0) {
      result = result.concat(flattenTree(node.children, fullPath));
    }
  });
  return result;
}

function pathLabel(fullPath) {
  return fullPath.map((n) => n.id).join(" › ");
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const items = [
    { key: "tree", label: "⚡ 電箱瀏覽" },
    { key: "devices", label: "🔍 設備瀏覽" },
    { key: "source", label: "💥 高壓電源" },
  ];

   const tabGroup = document.createElement("div");
   tabGroup.className = "tab-group";
  items.forEach((item) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (activeTab === item.key ? " active" : "");
    btn.textContent = item.label;
    btn.onclick = () => {
      activeTab = item.key;
      document.getElementById("searchInput").value = "";
      document.getElementById("searchResults").innerHTML = "";
      render();
    };
    tabGroup.appendChild(btn);
  });
   tabs.appendChild(tabGroup);

   const updateEl = document.createElement("span");
   updateEl.className = "update-time";
   updateEl.textContent = "最後更新時間：" + lastUpdated;
   tabs.appendChild(updateEl);
}

function renderSearch() {
  const wrap = document.getElementById("searchBoxWrap");
  const resultsEl = document.getElementById("searchResults");

  if (activeTab === "source") {
    wrap.style.display = "none";
    resultsEl.innerHTML = "";
    return;
  }
  wrap.style.display = "block";

  const input = document.getElementById("searchInput");
  input.placeholder = activeTab === "tree"
    ? "輸入電箱或設備名稱搜尋..."
    : "輸入設備名稱搜尋（例如：天車）...";

  input.oninput = () => {
    const q = input.value.trim().toLowerCase();
    resultsEl.innerHTML = "";
    if (!q) return;

    if (activeTab === "tree") {
      const all = flattenTree(powerData, []);
      const matches = all.filter(({ node }) =>
        (node.name && node.name.toLowerCase().includes(q)) ||
        (node.id && node.id.toLowerCase().includes(q))
      ).slice(0, 12);

      if (matches.length === 0) {
        resultsEl.innerHTML = `<div class="search-empty">找不到符合「${input.value}」的電箱、迴路或設備</div>`;
        return;
      }

      matches.forEach(({ node, path: fullPath }) => {
        const btn = document.createElement("button");
        btn.className = "search-result";
        btn.innerHTML = `
          <span class="r-name">${node.id}・${node.name || ""}</span>
          <span class="r-path">位於 ${pathLabel(fullPath)}</span>
        `;
        btn.onclick = () => {
          path = fullPath;
          input.value = "";
          resultsEl.innerHTML = "";
          render();
        };
        resultsEl.appendChild(btn);
      });
    } else {
      const index = buildDeviceIndex();
      const matches = [];
      Object.keys(index).forEach((type) => {
        index[type].forEach((item) => {
          if (
            item.node.name.toLowerCase().includes(q) ||
            item.node.id.toLowerCase().includes(q) ||
            type.toLowerCase().includes(q)
          ) {
            matches.push({ type, item });
          }
        });
      });

      if (matches.length === 0) {
        resultsEl.innerHTML = `<div class="search-empty">找不到符合「${input.value}」的設備</div>`;
        return;
      }

      matches.slice(0, 12).forEach(({ type, item }) => {
        const btn = document.createElement("button");
        btn.className = "search-result";
        btn.innerHTML = `
          <span class="r-name">${item.node.id}・${item.node.name}</span>
          <span class="r-path">類型：${type}・位於 ${pathLabel(item.path)}</span>
        `;
        btn.onclick = () => {
          devicePath = [type, item];
          input.value = "";
          resultsEl.innerHTML = "";
          render();
        };
        resultsEl.appendChild(btn);
      });
    }
  };
}

function renderTreeNav() {
  const backArea = document.getElementById("backButtonArea");
  backArea.innerHTML = "";

  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> 返回上一層`;
  backBtn.disabled = path.length === 0;
  backBtn.onclick = () => { path.pop(); render(); };
  backArea.appendChild(backBtn);

  const bcArea = document.getElementById("breadcrumbArea");
  bcArea.innerHTML = "";
  const bc = document.createElement("div");
  bc.className = "breadcrumb";

  const homeBtn = document.createElement("button");
  homeBtn.className = "crumb-btn" + (path.length === 0 ? " current" : "");
  homeBtn.textContent = "⌂ 全部電箱";
  homeBtn.onclick = () => { path = []; render(); };
  bc.appendChild(homeBtn);

  path.forEach((node, idx) => {
    const wire = document.createElement("span");
    wire.className = "crumb-wire";
    wire.textContent = "→";
    bc.appendChild(wire);

    const btn = document.createElement("button");
    btn.className = "crumb-btn" + (idx === path.length - 1 ? " current" : "");
    btn.textContent = node.id;
    btn.onclick = () => { path = path.slice(0, idx + 1); render(); };
    bc.appendChild(btn);
  });

  bcArea.appendChild(bc);
}

}
function iconMap() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon></svg>`;

function getCurrentLevel() {
  return path.length === 0 ? powerData : (path[path.length - 1].children || []);
}

function renderTreeContent() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const current = path[path.length - 1];
  if (current && isLeaf(current)) {
    const card = document.createElement("div");
    card.className = "detail-card";
    card.innerHTML = `
      <div class="tag">${current.id}</div>
      <h2>${current.name}</h2>
      ${current.location ? `<div class="note-row">${iconMap()}<span>${current.location}</span></div>` : ""}
      ${current.state ? `<div class="note-row"><span>狀態：${current.state === "on" ? "🟢 ON" : "🔴 OFF"}</span></div>` : ""}
      ${current.note ? `<div class="note-row">${iconBolt()}<span>${current.note}</span></div>` : ""}
    `;
    content.appendChild(card);
    return;
  }

  const level = getCurrentLevel();
  if (!level || level.length === 0) {
    content.innerHTML = `<div class="empty">這一層還沒有資料，請到 powerData 裡新增。</div>`;
    return;
  }

  const grid = document.createElement("div");
  grid.className = "grid";

  level.forEach((node) => {
    const btn = document.createElement("button");
    btn.className = "breaker" + (node.flagged ? " flagged" : "");
    btn.dataset.depth = path.length;
    const leaf = isLeaf(node);
    btn.innerHTML = `
          <div class="top-row">
            <span class="led"></span>
            <span class="code">${node.id}</span>
            ${node.state ? `<span class="state-badge ${node.state}">${node.state.toUpperCase()}</span>` : ""}
            ${!leaf ? '<span class="arrow">›</span>' : ""}
          </div>
          <span class="device-name">${node.name || ""}</span>
          ${node.location ? `<span class="meta">${node.location}</span>` : ""}
          ${node.upstream ? `<span class="meta">來源：${node.upstream}</span>` : ""}
    `;
    btn.onclick = () => { path.push(node); render(); };
    grid.appendChild(btn);
  });

  content.appendChild(grid);
}



const deviceTypeGroups = {
  "廠房照明": "照明", "辦公室照明": "照明", "警衛室照明": "照明", "大門照明": "照明", "消防機房照明": "照明",
  "鐵捲門照明": "照明", "宿舍照明": "照明", "倉庫照明": "照明", "廠房廁所照明": "照明", "高壓變電站照明": "照明",
};



function buildGroupIndex(index) {
  const groups = {};
  const ungrouped = [];
  Object.keys(index).forEach((type) => {
    const group = deviceTypeGroups[type];
    if (group) {
      if (!groups[group]) groups[group] = [];
      groups[group].push(type);
    } else {
     ungrouped.push(type);
    }
  });



  const subOrder = {
    "照明": ["辦公室照明", "宿舍照明", "廠房照明", "倉庫照明", "高壓變電站照明", "鐵捲門照明", "廠房廁所照明", "大門照明", "警衛室照明", "消防機房照明"],
    // 之後有其他分類要自訂順序，照這個格式繼續加
  };



  Object.keys(groups).forEach((groupName) => {
    const order = subOrder[groupName];
    if (order) {
      groups[groupName].sort((a, b) => order.indexOf(a) - order.indexOf(b));
    }
  });



  const topLevelOrder = ["照明", "天車", "變壓器", "捲門"]; 
  // 混合寫：分組名稱(如"照明")跟沒分組的類型名稱(如"天車")可以任意穿插



  const combined = [
    ...Object.keys(groups).map((name) => ({ name, isGroup: true })),
    ...ungrouped.map((name) => ({ name, isGroup: false })),
  ];
  combined.sort((a, b) => {
    const ai = topLevelOrder.indexOf(a.name);
    const bi = topLevelOrder.indexOf(b.name);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  return { groups, ungrouped, combined };
}

function buildDeviceIndex() {
  const all = flattenTree(powerData, []);
  const leaves = all.filter(({ node }) => isLeaf(node) && node.deviceType);
  const resolved = new Map(); // node -> 正確的 path

  leaves.forEach(({ node, path: fullPath }) => {
    if (!resolved.has(node)) {
    resolved.set(node, fullPath);
    return;
  }
  // 同一個設備第二次出現了，用 upstream 判斷哪條路徑才對
    if (node.upstream) {
      const isCorrectPath = fullPath.some((n) => n.id && n.id.includes(node.upstream));
      if (isCorrectPath) {
      resolved.set(node, fullPath); // 換成正確的那條
      }
    }
  });

  const map = {};
  resolved.forEach((fullPath, node) => {
    if (!map[node.deviceType]) map[node.deviceType] = [];
    map[node.deviceType].push({ node, path: fullPath });
  });



  const instanceOrder = {
    "廠房照明": ["1L3-1", "1L3-3", "1L3-5", "1L3-2", "1L3-4", "1L3-6", "1L4-1", "1L4-2", "1L4-3", "1L4-4", "1L6-1", "1L6-3", "1L6-5", "1L6-2", "1L6-4", "1L6-6", "1L9-1", "1L9-4", "1L9-3", "1L9-2", "1L9-12", "1L9-11", "1L9-8", "1L9A-4", "1L14-1", "1P7AL&R-3"],
    "倉庫照明":["1L6-7","1L6-9","1L6-12","料架照明-2","1L14-2"],
    "消防機房照明":["PF-1","LF-2"],
    "天車":["1P3-6","1P3-1","1P8A-3","1P7B-3","1P4-1","1P9B-4","1P10A-3"],
    // 之後想指定其他 deviceType 的個別順序，照這個格式繼續加
  };



  Object.keys(map).forEach((type) => {
    const order = instanceOrder[type];
    if (order) {
      map[type].sort((a, b) => order.indexOf(a.node.id) - order.indexOf(b.node.id));
    } else {
     map[type].sort((a, b) => a.node.id.localeCompare(b.node.id, undefined, { numeric: true }));
    }
  });
  return map;
}

function renderDeviceNav() {
  const backArea = document.getElementById("backButtonArea");
  backArea.innerHTML = "";

  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> 返回上一層`;
  backBtn.disabled = devicePath.length === 0;
  backBtn.onclick = () => { devicePath.pop(); render(); };
  backArea.appendChild(backBtn);

  const bcArea = document.getElementById("breadcrumbArea");
  bcArea.innerHTML = "";
  const bc = document.createElement("div");
  bc.className = "breadcrumb";

  const homeBtn = document.createElement("button");
  homeBtn.className = "crumb-btn" + (devicePath.length === 0 ? " current" : "");
  homeBtn.textContent = "⌂ 設備分類";
  homeBtn.onclick = () => { devicePath = []; render(); };
  bc.appendChild(homeBtn);

  devicePath.forEach((seg, idx) => {
    const wire = document.createElement("span");
    wire.className = "crumb-wire";
    wire.textContent = "→";
    bc.appendChild(wire);

    const isLast = idx === devicePath.length - 1;
    const btn = document.createElement("button");
    btn.className = "crumb-btn" + (isLast ? " current" : "");
    btn.textContent = typeof seg === "object" ? seg.node.id : seg;
    if (!isLast) {
      btn.onclick = () => { devicePath = devicePath.slice(0, idx + 1); render(); };
    }
    bc.appendChild(btn);
  });

  bcArea.appendChild(bc);
}

function renderDeviceContent() {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const index = buildDeviceIndex();
  const { groups, ungrouped, combined } = buildGroupIndex(index);

  if (Object.keys(index).length === 0) {
    content.innerHTML = `<div class="empty">目前沒有標記 deviceType 的設備，請到 powerData 裡幫需要反查的設備加上 deviceType 欄位。</div>`;
    return;
  }

  const last = devicePath[devicePath.length - 1];

  // 選到某個實際設備 -> 詳情卡
  if (typeof last === "object") {
    const { node, path: fullPath } = last;
    const card = document.createElement("div");
    card.className = "detail-card";
    card.innerHTML = `
      <div class="tag">${node.id}</div>
      <h2>${node.name}</h2>
      ${node.state ? `<div class="note-row"><span>狀態：${node.state === "on" ? "🟢 ON" : "🔴 OFF"}</span></div>` : ""}
      <div class="note-row">${iconMap()}<span>電箱位置：${pathLabel(fullPath)}</span></div>
      ${node.note ? `<div class="note-row">${iconBolt()}<span>${node.note}</span></div>` : ""}
    `;
    content.appendChild(card);
    return;
  }

  // 顯示某個 deviceType 底下的所有實體
  const isShowingInstances =
    devicePath.length === 2 ||
    (devicePath.length === 1 && !groups[devicePath[0]]);

  if (isShowingInstances) {
    const type = devicePath[devicePath.length - 1];
    const items = index[type] || [];
    const grid = document.createElement("div");
    grid.className = "grid";
    items.forEach((item) => {
      const btn = document.createElement("button");
      btn.className = "breaker";
      btn.dataset.depth = devicePath.length;
      btn.innerHTML = `
        <div class="top-row">
          <span class="led"></span>
          <span class="code">${item.node.id}</span>
          ${item.node.state ? `<span class="state-badge ${item.node.state}">${item.node.state.toUpperCase()}</span>` : ""}
          <span class="arrow">›</span>
        </div>
        <span class="device-name">${item.node.name}</span>
      `;
      btn.onclick = () => { devicePath = [...devicePath, item]; render(); };
      grid.appendChild(btn);
    });
    content.appendChild(grid);
    return;
  }

  // 選了某個分組(例如「照明」) -> 顯示裡面的子類型
  if (devicePath.length === 1 && groups[devicePath[0]]) {
    const types = groups[devicePath[0]];
    const grid = document.createElement("div");
    grid.className = "grid";
    types.forEach((type) => {
      const btn = document.createElement("button");
      btn.className = "breaker";
      btn.dataset.depth = 1;
      btn.innerHTML = `
        <div class="top-row"><span class="led"></span></div>
        <span class="count-badge">${index[type].length}</span>
        <span class="device-name">${type}</span>
        <span class="meta">共 ${index[type].length} 個位置</span>
        <span class="arrow">›</span>
      `;
      btn.onclick = () => { devicePath = [devicePath[0], type]; render(); };
      grid.appendChild(btn);
    });
    content.appendChild(grid);
    return;
  }

  // 第一層：列出所有分組 + 沒被分組的 deviceType
  const grid = document.createElement("div");
  grid.className = "grid";

  combined.forEach(({ name, isGroup }) => {
    const total = isGroup
      ? groups[name].reduce((sum, t) => sum + index[t].length, 0)
      : index[name].length;
    const btn = document.createElement("button");
    btn.className = "breaker";
    btn.dataset.depth = 0;
    btn.innerHTML = `
      <div class="top-row"><span class="led"></span></div>
      <span class="count-badge">${total}</span>
      <span class="device-name">${name}</span>
      <span class="meta">共 ${total} 個位置</span>
      <span class="arrow">›</span>
    `;
    btn.onclick = () => { devicePath = [name]; render(); };
    grid.appendChild(btn);
  });

  content.appendChild(grid);
  }

function buildSourceIndex() {
  const map = {};
  powerData.forEach((node) => {
    const src = node.source || "未分類";
    if (!map[src]) map[src] = [];
    map[src].push(node);
  });
  return map;
}

function renderSourceNav() {
  const backArea = document.getElementById("backButtonArea");
  backArea.innerHTML = "";

  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> 返回上一層`;
  backBtn.disabled = sourcePath.length === 0;
  backBtn.onclick = () => { sourcePath.pop(); render(); };
  backArea.appendChild(backBtn);

  const bcArea = document.getElementById("breadcrumbArea");
  bcArea.innerHTML = "";
  const bc = document.createElement("div");
  bc.className = "breadcrumb";

  const homeBtn = document.createElement("button");
  homeBtn.className = "crumb-btn" + (sourcePath.length === 0 ? " current" : "");
  homeBtn.textContent = "⌂ 高壓來源";
  homeBtn.onclick = () => { sourcePath = []; render(); };
  bc.appendChild(homeBtn);

  if (sourcePath[0]) {
    const wire = document.createElement("span");
    wire.className = "crumb-wire";
    wire.textContent = "→";
    bc.appendChild(wire);
    const btn = document.createElement("button");
    btn.className = "crumb-btn current";
    btn.textContent = sourcePath[0];
    bc.appendChild(btn);
  }

  bcArea.appendChild(bc);
}

function renderSourceContent() {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const index = buildSourceIndex();

  // 選了某個來源 -> 列出它底下的電箱，點下去直接跳到電箱瀏覽分頁
  if (sourcePath.length === 1) {
    const src = sourcePath[0];
    const panels = index[src] || [];
    if (panels.length === 0) {
      content.innerHTML = `<div class="empty">這個來源底下沒有電箱。</div>`;
      return;
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    panels.forEach((node) => {
      const btn = document.createElement("button");
      btn.className = "breaker";
      btn.dataset.depth = 1;
      btn.innerHTML = `
        <div class="top-row"><span class="led"></span><span class="code">${node.id}</span></div>
        <span class="device-name">${node.name || ""}</span>
        ${node.location ? `<span class="meta">${node.location}</span>` : ""}
        <span class="arrow">›</span>
      `;
      btn.onclick = () => {
        activeTab = "tree";
        path = [node];
        sourcePath = [];
        render();
      };
      grid.appendChild(btn);
    });
    content.appendChild(grid);
    return;
  }

  // 第一層：列出所有高壓來源
  const sources = Object.keys(index);
  const grid = document.createElement("div");
  grid.className = "grid";
  sources.forEach((src) => {
    const btn = document.createElement("button");
    btn.className = "breaker";
    btn.dataset.depth = 0;
    btn.innerHTML = `
      <div class="top-row"><span class="led"></span></div>
      <span class="count-badge">${index[src].length}</span>
      <span class="device-name">${src}</span>
      <span class="meta">共 ${index[src].length} 個電箱</span>
      <span class="arrow">›</span>
    `;
    btn.onclick = () => { sourcePath = [src]; render(); };
    grid.appendChild(btn);
  });
  content.appendChild(grid);
}

function render() {
  renderTabs();
  renderSearch();
  if (activeTab === "tree") {
    renderTreeNav();
    renderTreeContent();
  } else if (activeTab === "devices") {
    renderDeviceNav();
    renderDeviceContent();
  } else {
    renderSourceNav();
    renderSourceContent();
  }
}

render();
</script>
